# ansible-gui on docker01, in the stack conventions of the homelab wiki
# (/homelab/docker01-stacks): ~/ansible-gui/, env in app.env (mode 600), its own
# edge network, no host ports, Traefik on the LAN entrypoints only.
#
# Three containers from one image. The app holds every secret (the master key, the credential database,
# the OIDC and SMTP secrets) and never runs code from a repository. The fetcher pulls the repositories and
# installs their collections: it alone can write them, and it never runs them. The runner runs Ansible
# (inventory plugins, previews, the settings report, runs) from a read-only mount of what the fetcher wrote.
# Each worker gets one job at a time over its own Unix socket, which only the app may use, with only that
# job's credentials, and has nothing else to read.
#
# Before the first `docker compose up -d`:
#   1. Add the ansible-gui_edge network to ~/traefik/docker-compose.yml (next free 172.28.N.0/24).
#   2. Create a Pocket ID OIDC client: callback https://ansible.nanestor.us/auth/callback,
#      PKCE on, restricted to the admins group.
#   3. Fill in app.env from app.env.example and create secret.key as it describes.
#   4. mkdir data && sudo chown 10001 data   (the app runs as uid 10001; a
#      ./data that Docker creates is owned by root and the app can't write to it).

x-hardened: &hardened
  # An image from a66da07 on. The runner below is started with --clean-between-jobs, which earlier images don't
  # know: their runner exits at start, naming the argument. Images before 8c42c40 don't know `ansible-gui worker`
  # at all: they start the web app in all three containers, and the app then runs git and Ansible itself,
  # beside every secret.
  image: ghcr.io/mnestor/ansible-gui:sha-a66da07
  restart: unless-stopped
  # Only the volumes are writable, and nothing in a container can gain privileges. deploy/smoke-test.sh runs a
  # playbook under exactly this and checks what it can't reach.
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *hardened
    container_name: ansible-gui-app
    env_file: app.env
    environment:
      ANSIBLE_GUI_REPOS_DIR: /repos
      ANSIBLE_GUI_FETCHER_SOCKET: /run/fetcher/fetcher.sock
      ANSIBLE_GUI_RUNNER_SOCKET: /run/runner/runner.sock
    group_add:
      - "10010"                                            # the fetcher socket's group
      - "10011"                                            # the runner socket's group
    volumes:
      - ./data:/data
      - ./secret.key:/run/secrets/ansible-gui-key:ro
      - repos:/repos:ro                                    # lists playbooks, reads variables: never runs them
      - fetcher-sock:/run/fetcher
      - runner-sock:/run/runner
    tmpfs:
      - /tmp:size=64m
      - /home/app:size=16m,uid=10001,gid=10001,mode=0700
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    depends_on:
      - fetcher
      - runner
    networks:
      - edge                                               # Traefik in; Pocket ID and mail out
    labels:
      - traefik.enable=true
      - traefik.docker.network=ansible-gui_edge
      - traefik.http.routers.ansible.rule=Host(`ansible.nanestor.us`)
      - traefik.http.routers.ansible.entrypoints=web443,web443v6
      - traefik.http.services.ansible.loadbalancer.server.port=8080

  fetcher:
    <<: *hardened
    container_name: ansible-gui-fetcher
    user: "10002:10010"
    command: ["ansible-gui", "worker", "--jobs", "fetcher", "--socket", "/run/fetcher/fetcher.sock",
              "--allow-uid", "10001"]
    environment:
      ANSIBLE_GUI_REPOS_DIR: /repos
      ANSIBLE_HOME: /home/fetcher/.ansible
    volumes:
      - repos:/repos                                       # bare clones, commit and collections directories
      - fetcher-sock:/run/fetcher
    tmpfs:
      - /tmp:size=128m                                     # a pull's deploy key or token
      - /home/fetcher:size=64m,uid=10002,gid=10010,mode=0700   # ansible-galaxy's cache
    pids_limit: 256
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "test", "-S", "/run/fetcher/fetcher.sock"]
      interval: 30s
      timeout: 5s
    networks:
      - fetch                                              # the git server, Galaxy, and ssoossh for a repository's enrolled key

  runner:
    <<: *hardened
    container_name: ansible-gui-runner
    user: "10003:10011"
    # --clean-between-jobs: a playbook runs as the runner's own user, so each time the jobs are done the runner
    # kills every other process in this container and empties these directories, which are all a playbook can
    # write here. Nothing one job left is there for the next. A shell opened with `docker exec` goes too:
    # use `docker exec -u 0` to look around.
    command: ["ansible-gui", "worker", "--jobs", "runner", "--socket", "/run/runner/runner.sock",
              "--allow-uid", "10001",
              "--clean-between-jobs", "/tmp", "/home/runner", "/dev/shm", "/dev/mqueue", "/run/runner"]
    environment:
      ANSIBLE_GUI_REPOS_DIR: /repos
      ANSIBLE_HOME: /home/runner/.ansible
    volumes:
      - repos:/repos:ro                                    # a playbook can't change what later runs run
      - runner-sock:/run/runner
    tmpfs:
      - /tmp:size=512m                                     # per-run keys, agent socket, ansible-runner
      - /home/runner:size=64m,uid=10003,gid=10011,mode=0700    # ~/.ansible for local tasks, ssh's ~/.ssh
    # A runaway playbook (a fork bomb in a local task, forks set too high) stops here, not at the rest of
    # docker01. The /tmp tmpfs counts against mem_limit. docker01 has 4 CPUs and 8 GB (2026-11-20).
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: ["CMD", "test", "-S", "/run/runner/runner.sock"]
      interval: 30s
      timeout: 5s
    networks:
      - hosts                                              # SSH to the managed hosts, any jump host, and ssoossh

volumes:
  repos:                                                   # rebuilt from git if lost: nothing to back up
  fetcher-sock:                                            # sockets live in memory, never on disk
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10002,gid=10010,mode=0750"
  runner-sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10003,gid=10011,mode=0750"

# Each container on its own network, so a firewall can tell them apart by address: the app needs Traefik,
# Pocket ID and mail; the fetcher the git server and Galaxy; the runner the managed hosts. Nothing here narrows
# what each may reach yet: that is a rule on docker01 or OPNsense per subnet, once the playbooks' needs (lookups,
# APIs a local task calls) are listed. Subnets: the next free in 172.28.0.0/16 on docker01 (2026-11-20).
networks:
  edge:
    name: ansible-gui_edge                                 # 172.28.15.0/24, defined in ~/traefik
    external: true
  fetch:
    name: ansible-gui_fetch
    ipam:
      config:
        - subnet: 172.28.16.0/24
  hosts:
    name: ansible-gui_hosts
    ipam:
      config:
        - subnet: 172.28.17.0/24
