{# One icon set for the rail and for icon buttons: 24px grid, 1.75 stroke, currentColor. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "home" %}<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>
{%- elif name == "groups" %}<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>
{%- elif name == "hosts" %}<rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M8 7h.01M8 17h.01"/>
{%- elif name == "runs" %}<path d="M7 5l12 7-12 7z"/>
{%- elif name == "repos" %}<circle cx="7" cy="5" r="2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="8" r="2"/><path d="M7 7v10"/><path d="M17 10c0 4-10 2-10 7"/>
{%- elif name == "credentials" %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/>
{%- elif name == "collapse" %}<path d="M15 6l-6 6 6 6"/>
{%- elif name == "signout" %}<path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>
{%- elif name == "play" %}<path d="M8 5.5l11 6.5-11 6.5z"/>
{%- elif name == "schedule" %}<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M10 2h4"/><path d="M12 2v3"/>
{%- elif name == "template" %}<rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>
{%- elif name == "edit" %}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
{%- elif name == "chevron" %}<path d="M6 9l6 6 6-6"/>
{%- endif %}</svg>
{%- endmacro %}
