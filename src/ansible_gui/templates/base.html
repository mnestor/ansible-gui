<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Inventory{% endblock %} · ansible-gui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700&family=Red+Hat+Mono:wght@400;600&family=Red+Hat+Text:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-boost="true" class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">ansible-gui</a>
    <nav class="topnav" aria-label="Sections">
      <a href="/" {% if section == "home" %}aria-current="page"{% endif %}>Overview</a>
      <a href="/inventory" {% if section == "inventory" %}aria-current="page"{% endif %}>Inventory</a>
      <a href="/runs" {% if section == "runs" %}aria-current="page"{% endif %}>Runs{% if active_runs %} <span class="badge badge-accent tabular">{{ active_runs }}</span>{% endif %}</a>
      <a href="/schedules" {% if section == "schedules" %}aria-current="page"{% endif %}>Schedules</a>
      <a href="/credentials" {% if section == "credentials" %}aria-current="page"{% endif %}>Credentials</a>
    </nav>
    {% block topbar_extra %}{% endblock %}
    {% if user %}
      <form class="whoami" method="post" action="/auth/logout" hx-boost="false">
        <span class="whoami-name" title="{{ user.email or '' }}">{{ user.username or user.name or user.email }}</span>
        <button class="btn btn-quiet" type="submit">Sign out</button>
      </form>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
</body>
</html>
