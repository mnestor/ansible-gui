- name: Show what a run sees
  hosts: lab
  gather_facts: false
  tasks:
    - name: Report environment
      ansible.builtin.debug:
        msg: "secret={{ lookup('env', 'TEST_TOKEN') }} file={{ lookup('file', lookup('env', 'TEST_TOKEN_FILE')) }} agent={{ lookup('env', 'SSH_AUTH_SOCK') }} keys={{ lookup('pipe', 'ssh-add -l || true') }} user={{ ansible_user | default('none') }}"
