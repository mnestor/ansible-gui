[project]
name = "ansible-gui"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mike Nestor", email = "me@mikenestor.org" }
]
requires-python = ">=3.11"
dependencies = [
    "ansible-runner>=2.4.3",
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ansible-gui = "ansible_gui:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
