[project]
name = "ansible-gui"
version = "0.1.0.dev0"
description = "Web UI for Ansible: the resolved inventory with where every variable comes from, runs and schedules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mike Nestor", email = "me@mikenestor.org" }
]
requires-python = ">=3.11"
dependencies = [
    "ansible-runner>=2.4.3",
    "authlib>=1.9.8",
    "croniter>=7.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    # uvicorn with the two parts of uvicorn[standard] it uses here, the HTTP parser and the event loop.
    # The rest of that extra (websockets, watchfiles, python-dotenv) is for things ansible-gui doesn't do.
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0; sys_platform != 'win32'",
]

[project.scripts]
ansible-gui = "ansible_gui:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
# The ansible-core the image ships and CI tests with, locked with hashes like everything else.
# A separate program that ansible-gui runs as a subprocess; never imported (it is GPLv3).
ansible = [
    "ansible-core==2.21.4; python_full_version >= '3.12'",
]

[tool.uv]
default-groups = ["dev", "ansible"]

[tool.coverage.run]
source = ["ansible_gui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
