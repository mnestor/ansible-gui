# Tests, then builds the container image and pushes it to ghcr.io/<owner>/ansible-gui.
#   push to main      -> :main and :sha-<short>
#   tag v1.2.3        -> :1.2.3, :1.2, :latest
#   tag v0.1.0-dev    -> :0.1.0-dev only (a pre-release never moves :latest)
#   pull request      -> tests, a build and the smoke test, nothing pushed
# Nothing is pushed unless the tests, the audit (dependencies and Bandit) and deploy/smoke-test.sh pass.
# Actions are pinned to commit SHAs and base images to digests; .github/dependabot.yml proposes updates.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Tests (with the ansible-core from uv.lock, the one the image ships)
        run: uv run --frozen pytest -q --cov --cov-report=
      - name: Coverage summary
        if: success() || failure()
        run: |
          {
            echo "## Test coverage: $(uv run --frozen coverage report --format=total)% of lines and branches"
            echo
            echo "Files below 100%, least covered first. **Missing** lists uncovered lines; \`a->b\` is a branch never taken."
            echo
            uv run --frozen coverage report --format=markdown --sort=cover --skip-covered
            echo
            echo "Line-by-line report: the **coverage-html** artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen coverage html -q
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in what the image installs (uv.lock, ansible-core included)
        run: |
          uv export --frozen --no-dev --group ansible --no-emit-project --format requirements-txt -o requirements.txt
          uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --strict --disable-pip -r requirements.txt
      # What anyone pointing Bandit at the repository would be shown first. The lines it would flag at this
      # level (yaml.load with a SafeLoader subclass, SQL built from our own column names) carry "# nosec".
      - name: Static analysis of ansible-gui's own code (medium severity and up)
        run: uvx --python 3.12 --from bandit==1.9.4 bandit -q -r src -ll

  image:
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ansible-gui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (refuses to run open, starts, unprivileged, tools present)
        run: deploy/smoke-test.sh ansible-gui:test
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
