# Tests, then builds the container image and pushes it to ghcr.io/<owner>/ansible-gui.
#   push to main      -> :main and :sha-<short>
#   tag v1.2.3        -> :1.2.3, :1.2, :latest
#   tag v0.1.0-dev    -> :0.1.0-dev only (a pre-release never moves :latest)
#   pull request      -> tests, a build and the smoke test, nothing pushed
# Nothing is pushed unless the tests and deploy/smoke-test.sh pass.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tests (with the same ansible-core as the image)
        run: uv run --frozen --with "ansible-core==2.21.4" pytest -q --cov --cov-report=
      - name: Coverage summary
        if: success() || failure()
        run: |
          {
            echo "## Test coverage: $(uv run --frozen coverage report --format=total)% of lines and branches"
            echo
            echo "Files below 100%, least covered first. **Missing** lists uncovered lines; \`a->b\` is a branch never taken."
            echo
            uv run --frozen coverage report --format=markdown --sort=cover --skip-covered
            echo
            echo "Line-by-line report: the **coverage-html** artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen coverage html -q
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ansible-gui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (refuses to run open, starts, unprivileged, tools present)
        run: deploy/smoke-test.sh ansible-gui:test
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
